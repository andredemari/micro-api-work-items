[pytest]
testpaths = tests/unit tests/integration tests/system
markers =
    unit: isolated component or pure helper without database or subprocess
    integration: real component boundaries, in-process HTTP, SQLite or Git
    api: API theme, not a test level
    tooling: repository tooling theme, not a test level
    smoke: narrow health check purpose
    functional: cases selected from contracts and partitions
    structural: cases selected using measured production coverage
    system: separate owned HTTP process with synthetic storage
    characterization: observations, not normative product or security acceptance
